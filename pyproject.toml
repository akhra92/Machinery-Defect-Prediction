[project]
name = "machine-sound-anomaly"
version = "0.1.0"
description = "Unsupervised anomalous sound detection for factory machinery (DCASE Task 2 style)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.4",
    "torch>=2.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msad"]

# CUDA build of PyTorch (works on the RTX 4060). Remove this block to get the CPU build.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
