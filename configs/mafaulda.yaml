# MaFaulDa: sound + vibration recorded together on a machinery fault simulator (50 kHz, 5 s per file).
# Everything not set here comes from default.yaml.
inherit: default.yaml

dataset: mafaulda
data_root: data/mafaulda           # contains normal/, imbalance/, underhang/, ... with .csv files
modality: fusion

mafaulda:
  test_fraction: 0.3               # share of the 49 normal files held out for testing (split by file, not segment)
  files_per_fault: 20              # anomalous test files sampled per fault type (9 types); null = all 1902
  segment_seconds: 1.0             # each 5 s file becomes 5 clips
  vibration_channels: [1, 2, 3, 4, 5, 6]   # underhang + overhang accelerometers, 3 axes each
  sound_channel: 7                 # microphone

# Score-level fusion: each sensor's score is standardised on normal training clips, then combined.
# mean = both sensors must agree; max = an anomaly seen by either sensor is enough.
fusion:
  method: mean

features:
  sound:
    fmax: 8000
  vibration:
    sample_rate: 50000             # no resampling
    n_fft: 8192                    # ~6 Hz bins: resolves shaft harmonics (12-61 Hz rotation)
    hop_length: 2048
    n_mels: 64                     # per axis -> 6 x 64 = 384 bands
    power: 2.0
    fmin: 0
    fmax: 10000                    # accelerometer bandwidth is ~10 kHz
    n_frames: 5
